<!DOCTYPE html>
<html lang="pt-BR">
<head>

        --fg: #eaeaea;
        --muted: #9a9a9a;
        --accent: #8ab4f8;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      line-height: 1.7;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    main { max-width: 34rem; }
    h1 { font-size: 2.2rem; margin: 0 0 1rem; }
    p { color: var(--muted); margin: .5rem 0; }
    a { color: var(--accent); }
